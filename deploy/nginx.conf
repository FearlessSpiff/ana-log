# Example nginx site for ana-log. Replace ana-log.example.com with your domain,
# then get a certificate with: certbot --nginx -d ana-log.example.com

server {
    listen 80;
    listen [::]:80;
    server_name ana-log.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ana-log.example.com;

    ssl_certificate     /etc/letsencrypt/live/ana-log.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ana-log.example.com/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The Google login waits for its result over a server-sent events
        # stream (/api/realtime), which breaks if nginx buffers it.
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
    }
}
